[build]
# Was: buildCommand met pip install en crawl4ai-setup, plus een variabele
# RAILPACK_DEPLOY_APT_PACKAGES met twintig X11-bibliotheken die alleen in
# Railway's instellingenscherm bestond. Dat staat nu allemaal in de Dockerfile,
# en daarmee in de repository.
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Geen startCommand meer. Railway geeft die bij een Dockerfile door zonder
# shell, waardoor $PORT letterlijke tekst blijft en uvicorn afhaakt op
# "'$PORT' is not a valid integer". De CMD in de Dockerfile staat in shell-vorm
# en vult hem wel in — en is meteen dezelfde opdracht op elk platform.
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
